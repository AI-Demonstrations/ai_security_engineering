# Both deployments carry the same hardening; the comments on the gateway apply to both.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ticketbot
  labels: {app: gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels:
        app: gateway
        azure.workload.identity/use: "true"          # opt this pod in to workload identity
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                              # matches the UID baked into the image
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          # Pull by digest from your private ACR: a tag can be re-pointed, a digest cannot.
          image: <ACR_NAME>.azurecr.io/ticketbot-gateway@sha256:<DIGEST>
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          env:
            - {name: SERVICEBUS_NAMESPACE, value: "<SB_NAMESPACE>.servicebus.windows.net"}
            - {name: LLM_API_KEY_FILE, value: /mnt/secrets/llm-api-key}   # a file path, not the secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
          resources:                                  # limits also bound a runaway or abusive request
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: secrets, mountPath: /mnt/secrets, readOnly: true}
      volumes:
        - name: tmp                                   # the only writable path, in memory, size-capped
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: secrets                               # Key Vault secret mounted as a file (60-secretproviderclass.yaml)
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: gateway-secrets}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-billing
  namespace: ticketbot
  labels: {app: worker-billing}
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker-billing}
  template:
    metadata:
      labels:
        app: worker-billing
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: worker-billing
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: <ACR_NAME>.azurecr.io/ticketbot-worker@sha256:<DIGEST>
          imagePullPolicy: IfNotPresent
          # No ports: the worker only pulls from its Service Bus subscription. Nothing
          # needs to call it, so it has no Service and its NetworkPolicy admits nothing.
          env:
            - {name: SERVICEBUS_NAMESPACE, value: "<SB_NAMESPACE>.servicebus.windows.net"}
            - {name: SUBSCRIPTION, value: billing}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 250m, memory: 192Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
