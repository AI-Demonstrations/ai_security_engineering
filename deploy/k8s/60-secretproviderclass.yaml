# Secrets live in Azure Key Vault, not in Kubernetes Secrets, the image, or env vars.
# The CSI driver mounts them as read-only files, authenticating with the gateway's
# workload identity. Rotate in Key Vault and the file updates (with rotation enabled
# on the add-on). Env vars are avoided because they appear in crash dumps, child
# processes and `kubectl describe`.
#
# Prefer no secret at all: Service Bus and Azure OpenAI accept Entra ID tokens, so only
# a third-party API key (like a non-Azure LLM provider's) should ever need this.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gateway-secrets
  namespace: ticketbot
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "<GATEWAY_IDENTITY_CLIENT_ID>"       # workload identity
    keyvaultName: "<KEYVAULT_NAME>"
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: llm-api-key
          objectType: secret
