# One service account per component, each federated to its OWN user-assigned managed
# identity (azure/cluster.sh creates the identities and federated credentials).
# Azure RBAC is then granted per identity, so a compromised worker cannot publish and
# a compromised gateway cannot read the billing subscription.
#
# automountServiceAccountToken: false — no component calls the Kubernetes API, so no pod
# gets a Kubernetes API token. (Workload identity injects its own, separate, short-lived
# token for Entra ID; that is unaffected.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: ticketbot
  annotations:
    azure.workload.identity/client-id: "<GATEWAY_IDENTITY_CLIENT_ID>"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-billing
  namespace: ticketbot
  annotations:
    azure.workload.identity/client-id: "<WORKER_BILLING_IDENTITY_CLIENT_ID>"
automountServiceAccountToken: false
